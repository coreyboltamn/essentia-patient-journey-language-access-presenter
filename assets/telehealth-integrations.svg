<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="title">Telehealth technology integrations</title>
  <desc id="desc">Simplified illustrative graphic: an integrations header, six category tiles with generic partner placeholders, and a benefits sidebar in blue tones.</desc>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a5b"/>
      <stop offset="1" stop-color="#3359b5"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3359b5"/>
      <stop offset="1" stop-color="#0e3a5b"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0e3a5b" flood-opacity="0.12"/>
    </filter>
    <g id="tile">
      <rect width="204" height="184" rx="14" fill="#ffffff" stroke="#d3e0f0"/>
      <circle cx="30" cy="32" r="18" fill="#4fa3dc"/>
      <g fill="#e9eeff" stroke="#d3e0f0">
        <rect x="14" y="64" width="84" height="40" rx="8"/>
        <rect x="106" y="64" width="84" height="40" rx="8"/>
        <rect x="14" y="114" width="84" height="40" rx="8"/>
        <rect x="106" y="114" width="84" height="40" rx="8"/>
      </g>
      <g fill="#3359b5" opacity="0.55">
        <circle cx="32" cy="84" r="7"/>
        <rect x="44" y="80" width="42" height="8" rx="4"/>
        <rect x="118" y="78" width="12" height="12" rx="3"/>
        <rect x="136" y="80" width="42" height="8" rx="4"/>
        <path d="M25 141 l7 -14 l7 14 z"/>
        <rect x="44" y="130" width="42" height="8" rx="4"/>
        <circle cx="124" cy="134" r="7"/>
        <rect x="136" y="130" width="42" height="8" rx="4"/>
      </g>
      <text x="102" y="172" text-anchor="middle" font-size="10" fill="#5c7188">Partner placeholders</text>
    </g>
  </defs>

  <rect width="960" height="600" fill="#f3f8ff"/>

  <!-- Header -->
  <rect width="960" height="130" fill="url(#hdr)"/>
  <circle cx="860" cy="20" r="90" fill="#4fa3dc" opacity="0.18"/>
  <circle cx="930" cy="120" r="60" fill="#ffffff" opacity="0.08"/>
  <text x="32" y="52" font-size="13" font-weight="700" fill="#9fd0f2" letter-spacing="2">TELEHEALTH</text>
  <text x="32" y="86" font-size="30" font-weight="800" fill="#ffffff">Technology Integrations</text>
  <text x="32" y="112" font-size="14" fill="#d6e6f7">Connect qualified language access to the virtual care tools you already use</text>
  <g transform="translate(772 34)">
    <rect width="112" height="70" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="8" y="8" width="96" height="48" rx="4" fill="#4fa3dc"/>
    <circle cx="40" cy="27" r="9" fill="#ffffff"/>
    <path d="M26 50c0-9 6-13 14-13s14 4 14 13z" fill="#ffffff"/>
    <rect x="62" y="16" width="34" height="32" rx="3" fill="#ffffff" opacity="0.85"/>
    <circle cx="79" cy="27" r="6" fill="#3359b5"/>
    <path d="M69 44c0-6 4-9 10-9s10 3 10 9z" fill="#3359b5"/>
    <rect x="44" y="60" width="24" height="4" rx="2" fill="#3359b5"/>
  </g>

  <!-- Section label -->
  <text x="32" y="168" font-size="15" font-weight="800" fill="#0e3a5b">Integration categories</text>

  <!-- Category tiles -->
  <g filter="url(#sh)">
    <use href="#tile" x="32" y="186"/>
    <use href="#tile" x="254" y="186"/>
    <use href="#tile" x="476" y="186"/>
    <use href="#tile" x="32" y="386"/>
    <use href="#tile" x="254" y="386"/>
    <use href="#tile" x="476" y="386"/>
  </g>
  <g font-size="13" font-weight="700" fill="#15314b">
    <text x="88" y="223">Telehealth Platforms</text>
    <text x="310" y="223">EHR Systems</text>
    <text x="532" y="223">Video Conferencing</text>
    <text x="88" y="423">Patient Engagement</text>
    <text x="310" y="423">Scheduling</text>
    <text x="532" y="423">Mobile &amp; Devices</text>
  </g>
  <!-- Generic tile icons -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- video -->
    <rect x="52" y="211" width="14" height="14" rx="2" stroke="none"/>
    <path d="M67 215l5-3v12l-5-3z" stroke="none"/>
    <!-- record -->
    <rect x="276" y="208" width="16" height="20" rx="2" fill="none"/>
    <path d="M280 214h8M280 218h8M280 222h5" fill="none"/>
    <!-- conference -->
    <circle cx="500" cy="214" r="4" stroke="none"/>
    <circle cx="512" cy="214" r="4" stroke="none"/>
    <path d="M493 227c0-5 3-7 7-7s7 2 7 7zM505 227c0-5 3-7 7-7s7 2 7 7z" stroke="none"/>
    <!-- chat -->
    <path d="M52 409h20v12h-12l-5 4v-4h-3z" fill="none"/>
    <!-- calendar -->
    <rect x="275" y="410" width="18" height="16" rx="2" fill="none"/>
    <path d="M275 415h18M279 407v5M289 407v5" fill="none"/>
    <!-- mobile -->
    <rect x="500" y="407" width="12" height="22" rx="2" fill="none"/>
    <path d="M504 425h4" fill="none"/>
  </g>

  <!-- Benefits sidebar -->
  <g filter="url(#sh)">
    <rect x="704" y="150" width="224" height="420" rx="16" fill="url(#side)"/>
  </g>
  <text x="726" y="190" font-size="18" font-weight="800" fill="#ffffff">Key benefits</text>
  <rect x="726" y="202" width="40" height="4" rx="2" fill="#4fa3dc"/>
  <g font-size="13" fill="#ffffff">
    <g transform="translate(726 236)">
      <circle cx="11" cy="11" r="11" fill="#4fa3dc"/>
      <path d="M6 11l3.5 3.5L16 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="10" font-weight="700">Qualified interpreters</text>
      <text x="32" y="27" fill="#cfe2f6" font-size="11">join the virtual visit</text>
    </g>
    <g transform="translate(726 300)">
      <circle cx="11" cy="11" r="11" fill="#4fa3dc"/>
      <path d="M6 11l3.5 3.5L16 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="10" font-weight="700">Configured workflows</text>
      <text x="32" y="27" fill="#cfe2f6" font-size="11">fit existing care tools</text>
    </g>
    <g transform="translate(726 364)">
      <circle cx="11" cy="11" r="11" fill="#4fa3dc"/>
      <path d="M6 11l3.5 3.5L16 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="10" font-weight="700">Fewer handoffs</text>
      <text x="32" y="27" fill="#cfe2f6" font-size="11">for staff and clinicians</text>
    </g>
    <g transform="translate(726 428)">
      <circle cx="11" cy="11" r="11" fill="#4fa3dc"/>
      <path d="M6 11l3.5 3.5L16 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="10" font-weight="700">Consistent experience</text>
      <text x="32" y="27" fill="#cfe2f6" font-size="11">across languages and visits</text>
    </g>
  </g>
  <rect x="726" y="512" width="180" height="38" rx="19" fill="#ffffff"/>
  <text x="816" y="536" text-anchor="middle" font-size="13" font-weight="800" fill="#3359b5">Explore integrations</text>

  <text x="32" y="590" font-size="10" fill="#5c7188">Illustrative graphic only; partner names and logos are generic placeholders.</text>
</svg>
